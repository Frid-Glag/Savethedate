<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Save the Date — Ida & Fritjof</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        /* Base Styling & Smooth Aesthetics */
        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #F4F1EA;
            color: #2C2C2C;
            overflow-x: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .sans-subtle {
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.25em;
        }

        /* 3D Envelope Perspective Container */
        .scene {
            perspective: 1200px;
        }

        /* Envelope Outer Box */
        .envelope-wrapper {
            position: relative;
            width: 320px;
            height: 220px;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @media (min-width: 640px) {
            .envelope-wrapper {
                width: 420px;
                height: 280px;
            }
        }

        /* Paper Textures */
        .paper-texture {
            background-color: #FAF8F5;
            background-image: radial-gradient(#E8E2D5 0.75px, transparent 0.75px), radial-gradient(#E8E2D5 0.75px, #FAF8F5 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        .card-texture {
            background: #FAF8F5;
            box-shadow: inset 0 0 30px rgba(210, 200, 185, 0.25);
        }

        /* Embossed botanical wreath styling */
        .embossed-wreath-svg {
            filter: drop-shadow(1px 1px 1px rgba(255, 255, 255, 0.9)) drop-shadow(-1px -1px 1.5px rgba(60, 70, 50, 0.35));
        }

        /* Envelope Back Panel */
        .envelope-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #E5DFC8;
            background: linear-gradient(135deg, #E6E0D2 0%, #D8D0BE 100%);
            border-radius: 6px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15), 0 5px 15px -5px rgba(0, 0, 0, 0.08);
        }

        /* Flap 3D Transform Logic */
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: top center;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 4;
        }

        .flap-shape {
            width: 100%;
            height: 55%;
            background: #DDD5C3;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 -3px 6px rgba(0,0,0,0.05);
        }

        /* Envelope Front Pocket (Pockets left, right, bottom) */
        .envelope-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .pocket-bottom {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(0deg, #D4CBBA 0%, #DFD7C7 100%);
            clip-path: polygon(0 100%, 100% 100%, 50% 15%);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.04);
        }

        .pocket-left {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 55%;
            height: 100%;
            background: linear-gradient(90deg, #D0C7B5 0%, #DBD3C3 100%);
            clip-path: polygon(0 0, 0 100%, 100% 100%);
        }

        .pocket-right {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 55%;
            height: 100%;
            background: linear-gradient(-90deg, #D0C7B5 0%, #DBD3C3 100%);
            clip-path: polygon(100% 0, 0 100%, 100% 100%);
        }

        /* Wax Seal Styling */
        .wax-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 56px;
            height: 56px;
            background: radial-gradient(circle at 35% 35%, #C2825D, #8C4E2D 70%);
            border-radius: 50%;
            box-shadow: 0 6px 14px rgba(0,0,0,0.25), inset 0 2px 3px rgba(255,255,255,0.3), inset 0 -3px 5px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.4s ease;
            z-index: 5;
        }

        .wax-seal:hover {
            transform: translate(-50%, -50%) scale(1.06);
        }

        /* The Save the Date Card */
        .card {
            position: absolute;
            left: 5%;
            top: 5%;
            width: 90%;
            height: 90%;
            border-radius: 4px;
            transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1), z-index 0s 0.4s;
            z-index: 2;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.25rem;
            text-align: center;
            border: 1px solid rgba(215, 205, 190, 0.6);
            overflow: hidden;
        }

        /* Open State Animations */
        .open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .open .wax-seal {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.6);
        }

        /* Extended Card View state when fully pulled out */
        .card-extracted {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) scale(1) !important;
            width: 90vw !important;
            max-width: 420px !important;
            height: auto !important;
            aspect-ratio: 1 / 1.35 !important;
            z-index: 50 !important;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.3), 0 0 0 100vw rgba(244, 241, 234, 0.85) !important;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), width 0.8s ease, top 0.8s ease, left 0.8s ease !important;
        }

        /* Subtle Prompt Animation */
        @keyframes pulse-subtle {
            0%, 100% { opacity: 0.6; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-4px); }
        }

        .animate-prompt {
            animation: pulse-subtle 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 selection:bg-stone-200">

    <!-- Top Branding Header -->
    <header class="w-full max-w-md text-center pt-4 sm:pt-8 opacity-80">
        <span class="sans-subtle text-[10px] sm:text-xs text-stone-500 uppercase tracking-[0.3em]">Inbjudan</span>
        <h1 class="font-serif italic text-stone-700 text-lg sm:text-xl mt-1">Ida & Fritjof</h1>
    </header>

    <!-- Main Interactive Area -->
    <main class="scene my-auto py-8 w-full flex flex-col items-center justify-center">
        
        <div id="envelopeWrapper" class="envelope-wrapper" onclick="openEnvelope()">
            
            <!-- Envelope Backing -->
            <div class="envelope-back"></div>

            <!-- Card inside Envelope -->
            <div id="saveTheDateCard" class="card card-texture relative select-none">
                
                <!-- Embossed Botanical Wreath Graphic Overlay -->
                <svg class="absolute inset-0 w-full h-full p-2 pointer-events-none embossed-wreath-svg" viewBox="0 0 300 400" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Leafy Wreath Path Elements in Olive Tones -->
                    <g stroke="#6B7A59" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
                        <!-- Left Wreath Arch -->
                        <path d="M 60 330 C 20 250 20 130 90 60 C 120 30 150 25 150 25" />
                        <path d="M 45 290 Q 30 270 42 260" fill="#7A8B66" />
                        <path d="M 32 230 Q 15 210 30 200" fill="#7A8B66" />
                        <path d="M 28 170 Q 12 150 28 140" fill="#7A8B66" />
                        <path d="M 40 120 Q 30 95 50 90" fill="#7A8B66" />
                        <path d="M 65 75 Q 60 55 80 55" fill="#7A8B66" />
                        <path d="M 100 45 Q 110 30 125 38" fill="#7A8B66" />

                        <!-- Right Wreath Arch -->
                        <path d="M 240 330 C 280 250 280 130 210 60 C 180 30 150 25 150 25" />
                        <path d="M 255 290 Q 270 270 258 260" fill="#7A8B66" />
                        <path d="M 268 230 Q 285 210 270 200" fill="#7A8B66" />
                        <path d="M 272 170 Q 288 150 272 140" fill="#7A8B66" />
                        <path d="M 260 120 Q 270 95 250 90" fill="#7A8B66" />
                        <path d="M 235 75 Q 240 55 220 55" fill="#7A8B66" />
                        <path d="M 200 45 Q 190 30 175 38" fill="#7A8B66" />

                        <!-- Flower Accent Base Left -->
                        <circle cx="70" cy="315" r="7" fill="#6B7A59" opacity="0.4"/>
                        <circle cx="55" cy="325" r="5" fill="#6B7A59" opacity="0.3"/>
                        <circle cx="85" cy="330" r="4" fill="#6B7A59" opacity="0.3"/>

                        <!-- Flower Accent Top Right -->
                        <circle cx="225" cy="85" r="7" fill="#6B7A59" opacity="0.4"/>
                        <circle cx="240" cy="95" r="5" fill="#6B7A59" opacity="0.3"/>
                    </g>
                </svg>

                <!-- Soft Background Watermark Monogram I&F -->
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-[0.12]">
                    <span class="font-serif italic text-8xl sm:text-9xl text-amber-900 leading-none transform -rotate-6 select-none">I&F</span>
                </div>

                <!-- Text Content -->
                <div class="relative z-10 flex flex-col items-center justify-center h-full py-4 px-2">
                    <h2 class="font-serif text-2xl sm:text-3xl text-stone-700 tracking-[0.15em] font-medium my-2">
                        IDA & FRITJOF
                    </h2>

                    <p class="font-serif text-stone-600 tracking-[0.2em] text-sm sm:text-base my-3 font-normal">
                        4 SEPTEMBER 2027
                    </p>

                    <span class="sans-subtle text-[10px] sm:text-[11px] text-stone-700 uppercase tracking-[0.3em] font-medium mt-1 mb-4">
                        SAVE THE DATE
                    </span>

                    <span class="sans-subtle text-[8px] sm:text-[9px] text-stone-400 tracking-[0.2em] uppercase mt-2">
                        Formell inbjudan kommer
                    </span>
                </div>
            </div>

            <!-- Envelope Pocket (Front folds) -->
            <div class="envelope-pocket">
                <div class="pocket-left"></div>
                <div class="pocket-right"></div>
                <div class="pocket-bottom"></div>
            </div>

            <!-- Envelope Top Flap -->
            <div class="envelope-flap">
                <div class="flap-shape"></div>
            </div>

            <!-- Wax Seal -->
            <div id="waxSeal" class="wax-seal">
                <!-- Monogram IF inside Wax Seal -->
                <span class="font-serif italic text-amber-100/95 text-base tracking-tighter select-none">I&F</span>
            </div>

        </div>

        <!-- Tap Prompt -->
        <div id="tapPrompt" class="mt-8 text-center animate-prompt transition-opacity duration-500">
            <button onclick="openEnvelope()" class="sans-subtle text-[11px] text-stone-500 tracking-[0.25em] uppercase hover:text-stone-800 transition-colors">
                Klicka på kuvertet för att öppna
            </button>
        </div>

    </main>

    <!-- Footer Controls -->
    <footer class="w-full max-w-md text-center pb-4 sm:pb-6">
        <button id="resetBtn" onclick="resetEnvelope(event)" class="opacity-0 pointer-events-none sans-subtle text-[10px] text-stone-400 hover:text-stone-700 tracking-[0.2em] uppercase transition-all duration-500 border-b border-stone-300 pb-0.5">
            Stäng kuvertet igen
        </button>
    </footer>

    <!-- Interactive JavaScript -->
    <script>
        let isOpen = false;

        function openEnvelope() {
            if (isOpen) return;
            isOpen = true;

            const wrapper = document.getElementById('envelopeWrapper');
            const card = document.getElementById('saveTheDateCard');
            const prompt = document.getElementById('tapPrompt');
            const resetBtn = document.getElementById('resetBtn');

            // 1. Open Envelope Flap
            wrapper.classList.add('open');
            prompt.style.opacity = '0';

            // 2. Slide card up slightly inside envelope
            setTimeout(() => {
                card.style.transform = 'translateY(-60%)';
                card.style.zIndex = '10';
            }, 600);

            // 3. Zoom Card forward into full interactive focus view
            setTimeout(() => {
                card.classList.add('card-extracted');
                
                // Reveal Reset button
                resetBtn.classList.remove('opacity-0', 'pointer-events-none');
            }, 1200);
        }

        function resetEnvelope(e) {
            e.stopPropagation();
            if (!isOpen) return;
            isOpen = false;

            const wrapper = document.getElementById('envelopeWrapper');
            const card = document.getElementById('saveTheDateCard');
            const prompt = document.getElementById('tapPrompt');
            const resetBtn = document.getElementById('resetBtn');

            // Hide Reset button
            resetBtn.classList.add('opacity-0', 'pointer-events-none');

            // 1. Put card back inside envelope
            card.classList.remove('card-extracted');
            card.style.transform = 'translateY(-60%)';
            card.style.zIndex = '2';

            setTimeout(() => {
                card.style.transform = 'translateY(0)';
            }, 400);

            // 2. Close flap
            setTimeout(() => {
                wrapper.classList.remove('open');
                prompt.style.opacity = '1';
            }, 900);
        }
    </script>
</body>
</html>
