<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Save the Date — Ida & Fritjof</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #F3F0EA;
            color: #1B3B2B;
            overflow-x: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .sans-subtle {
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.22em;
        }

        /* Textured Paper Card Effect */
        .card-paper {
            background-color: #FAF8F3;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.7), rgba(240, 234, 222, 0.3)),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
            box-shadow: 0 18px 40px -5px rgba(50, 40, 30, 0.16), 0 0 0 1px rgba(210, 200, 185, 0.45);
        }

        /* Gold Ampersand Styling */
        .gold-ampersand {
            color: #C19A5B;
            background: linear-gradient(135deg, #D4AF37 0%, #C19A5B 50%, #9A7B3E 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 300;
        }

        /* Image Masking & Positioning to crop out water & jetty */
        .mansion-image-frame {
            width: 100%;
            height: 52%;
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        .mansion-image-frame img {
            width: 100%;
            height: 140%; /* Scaled up so we crop bottom water section */
            object-fit: cover;
            object-position: center 8%; /* Move mansion up towards top */
        }

        /* Fade transition at bottom of cropped image into paper background */
        .image-bottom-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 35px;
            background: linear-gradient(to bottom, rgba(250, 248, 243, 0) 0%, #FAF8F3 100%);
            pointer-events: none;
        }

        /* 3D Envelope Scene Styles */
        .scene {
            perspective: 1400px;
        }

        .envelope-wrapper {
            position: relative;
            width: 330px;
            height: 230px;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @media (min-width: 640px) {
            .envelope-wrapper {
                width: 450px;
                height: 300px;
            }
        }

        .envelope-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #EDE8DF;
            border-radius: 6px;
            box-shadow: 0 20px 45px -12px rgba(40, 30, 20, 0.18);
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: top center;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 4;
        }

        .flap-shape {
            width: 100%;
            height: 56%;
            background: linear-gradient(180deg, #E8E2D5 0%, #DFD8C9 100%);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.6);
        }

        .envelope-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .pocket-bottom {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(0deg, #DCD5C5 0%, #E6E0D2 100%);
            clip-path: polygon(0 100%, 100% 100%, 50% 15%);
        }

        .pocket-left {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 55%;
            height: 100%;
            background: linear-gradient(90deg, #D9D2C1 0%, #E2DCCB 100%);
            clip-path: polygon(0 0, 0 100%, 100% 100%);
        }

        .pocket-right {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 55%;
            height: 100%;
            background: linear-gradient(-90deg, #D9D2C1 0%, #E2DCCB 100%);
            clip-path: polygon(100% 0, 0 100%, 100% 100%);
        }

        .wax-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 56px;
            height: 56px;
            background: radial-gradient(circle at 35% 35%, #8A2525, #4A0E0E 80%);
            border-radius: 50%;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4), inset 0 2px 3px rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.4s ease;
            z-index: 5;
        }

        .card-in-envelope {
            position: absolute;
            left: 4%;
            top: 4%;
            width: 92%;
            height: 92%;
            border-radius: 3px;
            transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1), z-index 0s 0.4s;
            z-index: 2;
        }

        .open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .open .wax-seal {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.5);
        }

        .card-extracted {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) scale(1) !important;
            width: 90vw !important;
            max-width: 410px !important;
            height: auto !important;
            aspect-ratio: 1 / 1.5 !important;
            z-index: 50 !important;
            box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.28), 0 0 0 100vw rgba(236, 232, 223, 0.88) !important;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), width 0.8s ease !important;
        }

        @keyframes pulse-subtle {
            0%, 100% { opacity: 0.7; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-3px); }
        }

        .animate-prompt {
            animation: pulse-subtle 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 selection:bg-emerald-100">

    <!-- Mode Selector Header -->
    <header class="w-full max-w-lg flex flex-col items-center pt-2 sm:pt-4 z-10">
        <div class="inline-flex p-1 bg-stone-200/80 rounded-full border border-stone-300/70 shadow-inner mb-2">
            <button id="modeCardBtn" onclick="setMode('card')" class="sans-subtle text-[10px] sm:text-xs px-4 py-1.5 rounded-full transition-all duration-300 font-medium bg-white text-emerald-950 shadow-sm">
                Kortöversikt
            </button>
            <button id="modeEnvelopeBtn" onclick="setMode('envelope')" class="sans-subtle text-[10px] sm:text-xs px-4 py-1.5 rounded-full transition-all duration-300 font-medium text-stone-600 hover:text-stone-900">
                Interaktivt Kuvert
            </button>
        </div>
    </header>

    <!-- Main View Container -->
    <main class="w-full flex-1 flex flex-col items-center justify-center my-auto py-2">
        
        <!-- STANDALONE CARD VIEW -->
        <div id="standaloneCardView" class="w-full max-w-[400px] px-2 flex justify-center transition-all duration-500">
            
            <div class="card-paper relative w-full aspect-[1/1.5] rounded-[3px] p-4 sm:p-6 flex flex-col justify-between items-center text-center select-none overflow-hidden">
                
                <!-- Cropped Mansion Image Frame (Moved up, water & jetty masked out) -->
                <div class="mansion-image-frame shadow-sm">
                    <img src="card.jpg" alt="Asa Herrgård Akvarell" onerror="this.onerror=null; this.src='https://placehold.co/800x600/FDFBF7/2E4D23?text=Asa+Herrg%C3%A5rd';">
                    <div class="image-bottom-fade"></div>
                </div>

                <!-- Text Overlay Content -->
                <div class="my-auto pt-2 pb-1 flex flex-col items-center w-full">
                    
                    <!-- Heading -->
                    <p class="font-serif text-2xl sm:text-3xl text-[#1B3B2B] font-normal leading-tight tracking-wide">
                        Välkomna till
                    </p>

                    <!-- Names with Gold Ampersand -->
                    <h2 class="font-serif text-3xl sm:text-4xl text-[#1B3B2B] font-normal mt-1 mb-2 tracking-wide flex items-center justify-center gap-2">
                        <span>Ida</span>
                        <span class="gold-ampersand text-3xl sm:text-4xl font-light">&amp;</span>
                        <span>Fritjof</span>
                    </h2>

                    <!-- Subtitle -->
                    <p class="font-serif italic text-xs sm:text-sm text-[#1B3B2B]/90 mb-3 tracking-normal">
                        Spara datumet för vårt bröllop
                    </p>

                    <!-- Date -->
                    <p class="font-serif text-lg sm:text-xl text-[#1B3B2B] font-medium tracking-wide">
                        Lördagen den 4 September 2027
                    </p>

                    <!-- Venue Location -->
                    <p class="font-serif italic text-xs sm:text-sm text-[#1B3B2B]/85 mt-1 tracking-wide">
                        Asa Herrgård, Lammhult
                    </p>
                </div>

                <!-- Bottom Decorative Divider Line -->
                <div class="w-full pb-1 flex justify-center">
                    <div class="w-16 h-[1px] bg-gradient-to-r from-transparent via-[#C19A5B]/50 to-transparent"></div>
                </div>

            </div>

        </div>

        <!-- INTERACTIVE ENVELOPE VIEW -->
        <div id="interactiveEnvelopeView" class="scene hidden w-full flex flex-col items-center justify-center transition-all duration-500 py-4">
            
            <div id="envelopeWrapper" class="envelope-wrapper" onclick="openEnvelope()">
                
                <div class="envelope-back"></div>

                <!-- Card inside Envelope -->
                <div id="saveTheDateCard" class="card-in-envelope card-paper relative select-none flex flex-col justify-between items-center text-center p-3 overflow-hidden">
                    
                    <div class="mansion-image-frame h-[50%]">
                        <img src="card.jpg" alt="Asa Herrgård" onerror="this.onerror=null; this.src='https://placehold.co/800x600/FDFBF7/2E4D23?text=Asa+Herrg%C3%A5rd';">
                        <div class="image-bottom-fade"></div>
                    </div>

                    <div class="my-auto py-1">
                        <p class="font-serif text-xl text-[#1B3B2B]">Välkomna till</p>
                        <h2 class="font-serif text-2xl text-[#1B3B2B] font-normal">
                            Ida <span class="gold-ampersand text-2xl">&amp;</span> Fritjof
                        </h2>
                        <p class="font-serif italic text-xs text-[#1B3B2B]/90 mt-0.5">Spara datumet för vårt bröllop</p>
                        <p class="font-serif text-base text-[#1B3B2B] font-medium mt-1">Lördagen den 4 September 2027</p>
                        <p class="font-serif italic text-xs text-[#1B3B2B]/85">Asa Herrgård, Lammhult</p>
                    </div>

                    <div class="pb-1">
                        <div class="w-12 h-[1px] bg-[#C19A5B]/40 mx-auto"></div>
                    </div>
                </div>

                <div class="envelope-pocket">
                    <div class="pocket-left"></div>
                    <div class="pocket-right"></div>
                    <div class="pocket-bottom"></div>
                </div>

                <div class="envelope-flap">
                    <div class="flap-shape"></div>
                </div>

                <div id="waxSeal" class="wax-seal">
                    <span class="font-serif italic text-amber-100 text-sm tracking-tighter select-none font-bold">I&amp;F</span>
                </div>

            </div>

            <div id="tapPrompt" class="mt-6 text-center animate-prompt transition-opacity duration-500">
                <button onclick="openEnvelope()" class="sans-subtle text-[11px] text-stone-600 tracking-[0.2em] uppercase hover:text-stone-900 transition-colors">
                    Klicka på kuvertet för att öppna
                </button>
            </div>

        </div>

    </main>

    <!-- Footer Action -->
    <footer class="w-full max-w-md text-center pb-2 sm:pb-4">
        <button id="resetBtn" onclick="resetEnvelope(event)" class="opacity-0 pointer-events-none sans-subtle text-[10px] text-stone-500 hover:text-stone-800 tracking-[0.2em] uppercase transition-all duration-500 border-b border-stone-300 pb-0.5">
            Stäng kuvertet igen
        </button>
    </footer>

    <script>
        let isOpen = false;
        let currentMode = 'card';

        function setMode(mode) {
            currentMode = mode;
            const cardView = document.getElementById('standaloneCardView');
            const envelopeView = document.getElementById('interactiveEnvelopeView');
            const cardBtn = document.getElementById('modeCardBtn');
            const envelopeBtn = document.getElementById('modeEnvelopeBtn');
            const resetBtn = document.getElementById('resetBtn');

            if (mode === 'card') {
                cardView.classList.remove('hidden');
                envelopeView.classList.add('hidden');
                cardBtn.className = "sans-subtle text-[10px] sm:text-xs px-4 py-1.5 rounded-full transition-all duration-300 font-medium bg-white text-emerald-950 shadow-sm";
                envelopeBtn.className = "sans-subtle text-[10px] sm:text-xs px-4 py-1.5 rounded-full transition-all duration-300 font-medium text-stone-600 hover:text-stone-900";
                resetBtn.classList.add('opacity-0', 'pointer-events-none');
            } else {
                cardView.classList.add('hidden');
                envelopeView.classList.remove('hidden');
                envelopeBtn.className = "sans-subtle text-[10px] sm:text-xs px-4 py-1.5 rounded-full transition-all duration-300 font-medium bg-white text-emerald-950 shadow-sm";
                cardBtn.className = "sans-subtle text-[10px] sm:text-xs px-4 py-1.5 rounded-full transition-all duration-300 font-medium text-stone-600 hover:text-stone-900";
            }
        }

        function openEnvelope() {
            if (isOpen || currentMode !== 'envelope') return;
            isOpen = true;

            const wrapper = document.getElementById('envelopeWrapper');
            const card = document.getElementById('saveTheDateCard');
            const prompt = document.getElementById('tapPrompt');
            const resetBtn = document.getElementById('resetBtn');

            wrapper.classList.add('open');
            prompt.style.opacity = '0';

            setTimeout(() => {
                card.style.transform = 'translateY(-60%)';
                card.style.zIndex = '10';
            }, 600);

            setTimeout(() => {
                card.classList.add('card-extracted');
                resetBtn.classList.remove('opacity-0', 'pointer-events-none');
            }, 1200);
        }

        function resetEnvelope(e) {
            e.stopPropagation();
            if (!isOpen) return;
            isOpen = false;

            const wrapper = document.getElementById('envelopeWrapper');
            const card = document.getElementById('saveTheDateCard');
            const prompt = document.getElementById('tapPrompt');
            const resetBtn = document.getElementById('resetBtn');

            resetBtn.classList.add('opacity-0', 'pointer-events-none');

            card.classList.remove('card-extracted');
            card.style.transform = 'translateY(-60%)';
            card.style.zIndex = '2';

            setTimeout(() => {
                card.style.transform = 'translateY(0)';
            }, 400);

            setTimeout(() => {
                wrapper.classList.remove('open');
                prompt.style.opacity = '1';
            }, 900);
        }
    </script>
</body>
</html>
