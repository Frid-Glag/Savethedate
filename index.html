<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Save the Date — Ida & Fritjof</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Great+Vibes&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #EAE6DF;
            color: #1C3325;
            width: 100vw;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .sans-subtle {
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.2em;
        }

        .font-script {
            font-family: 'Great Vibes', cursive;
        }

        /* Helskärms-wrapper utan svarta kanter */
        .page-wrapper {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* Kuvert som täcker hela skärmen initialt */
        .envelope-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 100;
            cursor: pointer;
            perspective: 1600px;
            background-image: url('envelope.jpg');
            background-size: cover;
            background-position: center;
            transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1), transform 1.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.8s;
        }

        /* Animation vid klick på sigillet / kuvertet */
        .envelope-screen.open {
            opacity: 0;
            transform: translateY(-8%);
            visibility: hidden;
            pointer-events: none;
        }

        /* Texten nederst på kuvertet */
        .tap-prompt {
            position: absolute;
            bottom: 8dvh;
            left: 50%;
            transform: translateX(-50%);
            animation: pulse-subtle 2.5s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes pulse-subtle {
            0%, 100% { opacity: 0.5; transform: translate(-50%, 0); }
            50% { opacity: 1; transform: translate(-50%, -4px); }
        }

        /* Inbjudningskortet som glider upp nerifrån när kuvertet öppnas */
        .main-card {
            width: 100vw;
            max-width: 480px;
            min-height: 100vh;
            min-height: 100dvh;
            background: #FDFCF9;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2.5rem 1.5rem 2rem 1.5rem;
            text-align: center;
            position: relative;
            transform: translateY(40px);
            opacity: 0;
            transition: transform 2.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s, opacity 1.6s ease 0.4s;
            box-shadow: 0 0 50px rgba(0,0,0,0.06);
        }

        .envelope-screen.open + .main-card {
            transform: translateY(0);
            opacity: 1;
        }

        /* Mjuktonad kant på herrgårdsbilden */
        .image-crop-container {
            width: 100%;
            height: 220px;
            overflow: hidden;
            position: relative;
            border-radius: 6px;
            flex-shrink: 0;
            -webkit-mask-image: radial-gradient(ellipse 92% 92% at 50% 50%, #000 68%, transparent 100%);
            mask-image: radial-gradient(ellipse 92% 92% at 50% 50%, #000 68%, transparent 100%);
        }

        .image-crop-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            object-position: top center;
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        
        <!-- Helskärmskuvert utan svart ram -->
        <div id="envelopeScreen" class="envelope-screen" onclick="openEnvelope()">
            <div class="tap-prompt">
                <span class="sans-subtle text-[10px] text-stone-600 tracking-[0.25em] uppercase border-b border-stone-400/40 pb-0.5">
                    TAP THE SEAL TO OPEN
                </span>
            </div>
        </div>

        <!-- Inbjudningskortet som tonas in och stiger upp -->
        <main id="saveTheDateCard" class="main-card select-none">
            
            <div class="pt-2">
                <p class="font-serif italic text-sm text-emerald-900/80">
                    Save the date
                </p>
            </div>

            <!-- Herrgårdsbild med mjuk tonad övergång -->
            <div class="image-crop-container my-3">
                <img src="card.jpg" alt="Asa Herrgård">
            </div>

            <div class="my-auto py-2 flex flex-col items-center w-full z-10">
                <h2 class="font-script text-5xl sm:text-6xl text-emerald-950 leading-tight">
                    Ida <span class="text-4xl sm:text-5xl">&amp;</span> Fritjof
                </h2>

                <p class="font-serif text-base sm:text-lg text-emerald-950 mt-2 font-normal">
                    Lördag 4 september 2027
                </p>

                <p class="sans-subtle text-[10px] text-emerald-900/70 uppercase tracking-[0.2em] mt-1">
                    04 . 09 . 2027 &nbsp;•&nbsp; ASA HERRGÅRD
                </p>
            </div>

            <div class="w-full px-4 my-2 z-10">
                <div class="w-16 h-[1px] bg-emerald-900/20 mx-auto mb-3"></div>
                <div class="grid grid-cols-3 gap-3 text-center max-w-[220px] mx-auto">
                    <div>
                        <span id="days" class="font-serif text-xl sm:text-2xl font-medium text-emerald-950">---</span>
                        <p class="sans-subtle text-[8px] text-emerald-800/70 uppercase tracking-widest mt-0.5">dagar</p>
                    </div>
                    <div>
                        <span id="hours" class="font-serif text-xl sm:text-2xl font-medium text-emerald-950">--</span>
                        <p class="sans-subtle text-[8px] text-emerald-800/70 uppercase tracking-widest mt-0.5">timmar</p>
                    </div>
                    <div>
                        <span id="minutes" class="font-serif text-xl sm:text-2xl font-medium text-emerald-950">--</span>
                        <p class="sans-subtle text-[8px] text-emerald-800/70 uppercase tracking-widest mt-0.5">minuter</p>
                    </div>
                </div>
            </div>

            <div class="w-full px-4 mb-3 z-10">
                <p class="font-serif italic text-xs sm:text-sm text-emerald-900/80 mb-3">
                    Vi gifter oss på Asa Herrgård. Spara lördagen åt oss!
                </p>

                <button onclick="addToCalendar(event)" class="inline-flex items-center gap-2 px-4 py-1.5 border border-emerald-900/30 rounded-full sans-subtle text-[10px] text-emerald-950 uppercase tracking-[0.15em] hover:bg-emerald-950 hover:text-white transition-colors duration-300">
                    <span>Lägg till i kalendern</span>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                </button>
            </div>

            <!-- Akvarellblad i hörnen -->
            <svg class="absolute bottom-0 left-0 w-24 sm:w-28 h-auto pointer-events-none opacity-80" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M 0 100 Q 30 70 15 35 Q 25 55 45 40" stroke="#3D5A45" stroke-width="1.2" fill="none" opacity="0.6"/>
                <path d="M 10 75 C 5 60 20 55 25 70 C 20 78 12 80 10 75 Z" fill="#4B6953" opacity="0.75"/>
                <path d="M 22 55 C 18 42 32 40 34 52 C 30 60 24 60 22 55 Z" fill="#3D5A45" opacity="0.8"/>
            </svg>

            <svg class="absolute bottom-0 right-0 w-24 sm:w-28 h-auto pointer-events-none opacity-80 transform scale-x-[-1]" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M 0 100 Q 30 70 15 35 Q 25 55 45 40" stroke="#3D5A45" stroke-width="1.2" fill="none" opacity="0.6"/>
                <path d="M 10 75 C 5 60 20 55 25 70 C 20 78 12 80 10 75 Z" fill="#4B6953" opacity="0.75"/>
                <path d="M 22 55 C 18 42 32 40 34 52 C 30 60 24 60 22 55 Z" fill="#3D5A45" opacity="0.8"/>
            </svg>

        </main>

    </div>

    <script>
        const targetDate = new Date('2027-09-04T15:00:00');

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;

            if (diff <= 0) {
                document.getElementById('days').innerText = '0';
                document.getElementById('hours').innerText = '0';
                document.getElementById('minutes').innerText = '0';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        function openEnvelope() {
            const env = document.getElementById('envelopeScreen');
            env.classList.add('open');
        }

        function addToCalendar(e) {
            e.stopPropagation();
            const icsData = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Ida & Fritjof Wedding//EN',
                'BEGIN:VEVENT',
                'SUMMARY:Bröllop — Ida & Fritjof',
                'DESCRIPTION:Save the date för Ida & Fritjofs bröllop på Asa Herrgård!',
                'LOCATION:Asa Herrgård, Lammhult',
                'DTSTART:20270904T130000Z',
                'DTEND:20270905T010000Z',
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\n');

            const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', 'Ida_och_Fritjof_Brollop.ics');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
