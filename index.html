<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Save the Date — Ida & Fritjof</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #E6E2D8;
            color: #2C352E;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        .sans-subtle {
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.25em;
        }

        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 480px;
            max-height: 880px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Skrapduken som ligger ovanpå inbjudan */
        #scratchCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: pointer;
            transition: opacity 1.2s ease, visibility 1.2s;
        }

        #scratchCanvas.revealed {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .animate-prompt {
            position: absolute;
            bottom: 6dvh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            animation: pulse-subtle 2.5s infinite ease-in-out;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        @keyframes pulse-subtle {
            0%, 100% { opacity: 0.6; transform: translate(-50%, 0); }
            50% { opacity: 1; transform: translate(-50%, -4px); }
        }

        /* Inbjudningskortet under skrapskiktet */
        .card {
            position: absolute;
            width: 90%;
            max-width: 410px;
            height: 90%;
            max-height: 700px;
            background: #FAF8F5;
            border-radius: 3px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2.2rem 1.4rem 1.4rem 1.4rem;
            text-align: center;
            border: 1px solid rgba(210, 200, 185, 0.45);
            z-index: 2;
            touch-action: auto;
        }

        .image-crop-container {
            width: 100%;
            height: 240px;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
            margin: 0.5rem 0;
            border-radius: 2px;
        }

        .image-crop-container img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center;
        }
    </style>
</head>
<body>

    <main id="sceneWrapper" class="scene">
        
        <!-- Canvas där kuvertet/sigillet ritas upp och skrapas bort -->
        <canvas id="scratchCanvas"></canvas>

        <div id="tapPrompt" class="animate-prompt">
            <span class="sans-subtle text-[10px] text-stone-600 tracking-[0.25em] uppercase border-b border-stone-400/50 pb-0.5">
                SKRAPA FÖR ATT ÖPPNA
            </span>
        </div>

        <!-- Inbjudningskortet under -->
        <div id="saveTheDateCard" class="card select-none">
            
            <div class="pt-1">
                <p class="sans-subtle text-[11px] sm:text-[12px] text-stone-600 uppercase tracking-[0.3em]">
                    SAVE THE DATE
                </p>
            </div>

            <div class="my-1 flex flex-col items-center justify-center">
                <h1 class="font-serif text-3xl sm:text-4xl text-stone-800 tracking-[0.2em] uppercase font-light leading-tight">
                    IDA
                </h1>
                <span class="font-serif italic text-xl text-stone-600 my-0.5">&amp;</span>
                <h1 class="font-serif text-3xl sm:text-4xl text-stone-800 tracking-[0.2em] uppercase font-light leading-tight">
                    FRITJOF
                </h1>
            </div>

            <div class="image-crop-container">
                <img src="card.jpg" alt="Asa Herrgård">
            </div>

            <div class="mb-2">
                <h3 class="font-serif text-lg sm:text-xl text-stone-800 tracking-[0.2em] uppercase font-normal">
                    4:E SEPTEMBER 2027
                </h3>
                <p class="sans-subtle text-[10px] text-stone-500 uppercase tracking-[0.25em] mt-1">
                    ASA HERRGÅRD
                </p>
            </div>

            <div class="w-full pt-2 border-t border-stone-300/60 z-10">
                <div class="grid grid-cols-3 gap-2 text-center max-w-[190px] mx-auto mb-2">
                    <div>
                        <span id="days" class="font-serif text-base font-medium text-stone-800">---</span>
                        <p class="sans-subtle text-[7px] text-stone-500 uppercase tracking-widest">dagar</p>
                    </div>
                    <div>
                        <span id="hours" class="font-serif text-base font-medium text-stone-800">--</span>
                        <p class="sans-subtle text-[7px] text-stone-500 uppercase tracking-widest">timmar</p>
                    </div>
                    <div>
                        <span id="minutes" class="font-serif text-base font-medium text-stone-800">--</span>
                        <p class="sans-subtle text-[7px] text-stone-500 uppercase tracking-widest">minuter</p>
                    </div>
                </div>

                <button onclick="addToCalendar(event)" class="inline-flex items-center gap-1.5 px-3.5 py-1 border border-stone-400 rounded-full sans-subtle text-[8px] text-stone-700 uppercase tracking-[0.15em] hover:bg-stone-800 hover:text-white transition-colors duration-300">
                    <span>SPARA I KALENDERN</span>
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                </button>
            </div>

        </div>

    </main>

    <script>
        const canvas = document.getElementById('scratchCanvas');
        const ctx = canvas.getContext('2d');
        const prompt = document.getElementById('tapPrompt');
        let isDrawing = false;
        let scratchedPixels = 0;
        let isRevealed = false;

        const envImg = new Image();
        envImg.src = 'envelope.jpg';

        function initCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            if (envImg.complete) {
                drawEnvelope();
            } else {
                envImg.onload = drawEnvelope;
            }
        }

        function drawEnvelope() {
            ctx.drawImage(envImg, 0, 0, canvas.width, canvas.height);
            drawWaxSeal();
        }

        function drawWaxSeal() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 38;

            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 6;

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#3D5335';
            ctx.fill();
            ctx.restore();

            ctx.font = 'italic 24px "Cormorant Garamond", serif';
            ctx.fillStyle = '#E2EBDC';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('I&F', centerX, centerY);
        }

        function scratch(e) {
            if (isRevealed) return;

            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const x = clientX - rect.left;
            const y = clientY - rect.top;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 35, 0, Math.PI * 2);
            ctx.fill();

            checkScratchProgress();
        }

        function checkScratchProgress() {
            if (isRevealed) return;

            scratchedPixels++;
            if (scratchedPixels > 25) {
                isRevealed = true;
                canvas.classList.add('revealed');
                if (prompt) prompt.style.opacity = '0';
            }
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
        canvas.addEventListener('mousemove', (e) => { if (isDrawing) scratch(e); });
        canvas.addEventListener('mouseup', () => isDrawing = false);

        canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
        canvas.addEventListener('touchmove', (e) => { if (isDrawing) scratch(e); });
        canvas.addEventListener('touchend', () => isDrawing = false);

        window.addEventListener('resize', initCanvas);
        window.addEventListener('load', initCanvas);

        // Live Nedräkning
        const targetDate = new Date('2027-09-04T15:00:00');
        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;

            if (diff <= 0) {
                document.getElementById('days').innerText = '0';
                document.getElementById('hours').innerText = '0';
                document.getElementById('minutes').innerText = '0';
                return;
            }

            document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('hours').innerText = Math.floor((diff / (1000 * 60 * 60)) % 24);
            document.getElementById('minutes').innerText = Math.floor((diff / 1000 / 60) % 60);
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        function addToCalendar(e) {
            e.stopPropagation();
            const icsData = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Ida & Fritjof Wedding//EN',
                'BEGIN:VEVENT',
                'SUMMARY:Bröllop — Ida & Fritjof',
                'DESCRIPTION:Save the date för Ida & Fritjofs bröllop på Asa Herrgård!',
                'LOCATION:Asa Herrgård, Lammhult',
                'DTSTART:20270904T130000Z',
                'DTEND:20270905T010000Z',
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\n');

            const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', 'Ida_och_Fritjof_Brollop.ics');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
