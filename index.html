<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Save the Date — Ida & Fritjof</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Great+Vibes&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #F4F1EA;
            color: #1C3325;
            overflow-x: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .sans-subtle {
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.2em;
        }

        .font-script {
            font-family: 'Great Vibes', cursive;
        }

        .scene {
            perspective: 1200px;
        }

        .envelope-wrapper {
            position: relative;
            width: 320px;
            height: 220px;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @media (min-width: 640px) {
            .envelope-wrapper {
                width: 440px;
                height: 290px;
            }
        }

        /* Subtelt präglat botaniskt mönster i kuvertets papper */
        .embossed-paper {
            background-color: #EDE8DF;
            background-image: radial-gradient(#d5cebe 0.75px, transparent 0.75px), radial-gradient(#d5cebe 0.75px, #EDE8DF 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        .card-texture {
            background: #FDFCF9;
            background-image: 
                radial-gradient(circle at 10% 90%, rgba(67, 100, 72, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(67, 100, 72, 0.08) 0%, transparent 40%);
            box-shadow: inset 0 0 25px rgba(210, 205, 195, 0.25);
        }

        .envelope-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 6px;
            box-shadow: 0 18px 40px -10px rgba(0, 0, 0, 0.12);
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: top center;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 4;
        }

        .flap-shape {
            width: 100%;
            height: 55%;
            background: linear-gradient(180deg, #E6E0D3 0%, #DFD9CB 100%);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.6);
        }

        .envelope-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .pocket-bottom {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(0deg, #DCD5C5 0%, #E6E0D2 100%);
            clip-path: polygon(0 100%, 100% 100%, 50% 15%);
        }

        .pocket-left {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 55%;
            height: 100%;
            background: linear-gradient(90deg, #D9D2C1 0%, #E2DCCB 100%);
            clip-path: polygon(0 0, 0 100%, 100% 100%);
        }

        .pocket-right {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 55%;
            height: 100%;
            background: linear-gradient(-90deg, #D9D2C1 0%, #E2DCCB 100%);
            clip-path: polygon(100% 0, 0 100%, 100% 100%);
        }

        .wax-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 56px;
            height: 56px;
            background: radial-gradient(circle at 35% 35%, #7D2626, #4A1515 80%);
            border-radius: 50%;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.4s ease;
            z-index: 5;
        }

        .card {
            position: absolute;
            left: 4%;
            top: 4%;
            width: 92%;
            height: 92%;
            border-radius: 3px;
            transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1), z-index 0s 0.4s;
            z-index: 2;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1rem 1rem 1rem;
            text-align: center;
            border: 1px solid rgba(190, 180, 165, 0.35);
            overflow: hidden;
        }

        .open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .open .wax-seal {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.6);
        }

        .card-extracted {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) scale(1) !important;
            width: 90vw !important;
            max-width: 390px !important;
            height: auto !important;
            aspect-ratio: 1 / 1.62 !important;
            z-index: 50 !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 100vw rgba(244, 241, 234, 0.85) !important;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), width 0.8s ease !important;
        }

        .image-crop-container {
            width: 100%;
            height: 195px;
            overflow: hidden;
            position: relative;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .image-crop-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            object-position: top center;
        }

        @keyframes pulse-subtle {
            0%, 100% { opacity: 0.6; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-4px); }
        }

        .animate-prompt {
            animation: pulse-subtle 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 selection:bg-emerald-100">

    <header class="w-full max-w-md text-center pt-2 sm:pt-4 opacity-80">
        <span class="sans-subtle text-[10px] sm:text-xs text-emerald-950 uppercase tracking-[0.3em]">Save the Date</span>
        <h1 class="font-serif italic text-emerald-950 text-base sm:text-lg mt-0.5">Ida & Fritjof</h1>
    </header>

    <main class="scene my-auto py-4 w-full flex flex-col items-center justify-center">
        
        <div id="envelopeWrapper" class="envelope-wrapper" onclick="openEnvelope()">
            
            <div class="envelope-back embossed-paper"></div>

            <div id="saveTheDateCard" class="card card-texture relative select-none">
                
                <div class="pt-0.5 pb-0.5">
                    <p class="font-serif italic text-xs sm:text-sm text-emerald-900/80">
                        Save the date
                    </p>
                </div>

                <!-- Huset -->
                <div class="image-crop-container my-1">
                    <img src="card.jpg" alt="Asa Herrgård">
                </div>

                <!-- Namn i klassisk skripttypografi -->
                <div class="my-auto py-0.5 flex flex-col items-center w-full z-10">
                    <h2 class="font-script text-4xl sm:text-5xl text-emerald-950 leading-tight">
                        Ida <span class="text-3xl sm:text-4xl">&amp;</span> Fritjof
                    </h2>

                    <p class="font-serif text-sm sm:text-base text-emerald-950 mt-1 font-normal">
                        Lördag 4 september 2027
                    </p>

                    <p class="sans-subtle text-[9px] sm:text-[10px] text-emerald-900/70 uppercase tracking-[0.2em] mt-0.5">
                        04 . 09 . 2027 &nbsp;•&nbsp; ASA HERRGÅRD
                    </p>
                </div>

                <!-- Live-nedräknare -->
                <div class="w-full px-4 my-1.5 z-10">
                    <div class="w-12 h-[1px] bg-emerald-900/20 mx-auto mb-2"></div>
                    <div class="grid grid-cols-3 gap-2 text-center max-w-[200px] mx-auto">
                        <div>
                            <span id="days" class="font-serif text-lg sm:text-xl font-medium text-emerald-950">---</span>
                            <p class="sans-subtle text-[8px] text-emerald-800/70 uppercase tracking-widest">dagar</p>
                        </div>
                        <div>
                            <span id="hours" class="font-serif text-lg sm:text-xl font-medium text-emerald-950">--</span>
                            <p class="sans-subtle text-[8px] text-emerald-800/70 uppercase tracking-widest">timmar</p>
                        </div>
                        <div>
                            <span id="minutes" class="font-serif text-lg sm:text-xl font-medium text-emerald-950">--</span>
                            <p class="sans-subtle text-[8px] text-emerald-800/70 uppercase tracking-widest">minuter</p>
                        </div>
                    </div>
                </div>

                <!-- Meddelande och Kalender-knapp -->
                <div class="w-full px-4 mb-1 z-10">
                    <p class="font-serif italic text-xs text-emerald-900/80 mb-2">
                        Vi gifter oss på Asa Herrgård. Spara lördagen åt oss!
                    </p>

                    <button onclick="addToCalendar(event)" class="inline-flex items-center gap-1.5 px-3 py-1 border border-emerald-900/30 rounded-full sans-subtle text-[9px] text-emerald-950 uppercase tracking-[0.15em] hover:bg-emerald-950 hover:text-white transition-colors duration-300">
                        <span>Lägg till i kalendern</span>
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                    </button>
                </div>

                <!-- Gröna botaniska akvarellblad (Vänster) -->
                <svg class="absolute bottom-0 left-0 w-24 sm:w-28 h-auto pointer-events-none opacity-80" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 0 100 Q 30 70 15 35 Q 25 55 45 40" stroke="#3D5A45" stroke-width="1.2" fill="none" opacity="0.6"/>
                    <path d="M 10 75 C 5 60 20 55 25 70 C 20 78 12 80 10 75 Z" fill="#4B6953" opacity="0.75"/>
                    <path d="M 22 55 C 18 42 32 40 34 52 C 30 60 24 60 22 55 Z" fill="#3D5A45" opacity="0.8"/>
                    <path d="M 38 42 C 35 30 48 30 48 40 C 44 46 40 46 38 42 Z" fill="#608069" opacity="0.7"/>
                </svg>

                <!-- Gröna botaniska akvarellblad (Höger) -->
                <svg class="absolute bottom-0 right-0 w-24 sm:w-28 h-auto pointer-events-none opacity-80 transform scale-x-[-1]" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 0 100 Q 30 70 15 35 Q 25 55 45 40" stroke="#3D5A45" stroke-width="1.2" fill="none" opacity="0.6"/>
                    <path d="M 10 75 C 5 60 20 55 25 70 C 20 78 12 80 10 75 Z" fill="#4B6953" opacity="0.75"/>
                    <path d="M 22 55 C 18 42 32 40 34 52 C 30 60 24 60 22 55 Z" fill="#3D5A45" opacity="0.8"/>
                    <path d="M 38 42 C 35 30 48 30 48 40 C 44 46 40 46 38 42 Z" fill="#608069" opacity="0.7"/>
                </svg>

            </div>

            <div class="envelope-pocket">
                <div class="pocket-left"></div>
                <div class="pocket-right"></div>
                <div class="pocket-bottom"></div>
            </div>

            <div class="envelope-flap">
                <div class="flap-shape"></div>
            </div>

            <div id="waxSeal" class="wax-seal">
                <span class="font-serif italic text-amber-100 text-sm tracking-tighter select-none font-bold">I&amp;F</span>
            </div>

        </div>

        <div id="tapPrompt" class="mt-6 text-center animate-prompt transition-opacity duration-500">
            <button onclick="openEnvelope()" class="sans-subtle text-[11px] text-stone-600 tracking-[0.2em] uppercase hover:text-stone-900 transition-colors">
                Klicka på kuvertet för att öppna
            </button>
        </div>

    </main>

    <footer class="w-full max-w-md text-center pb-3 sm:pb-5">
        <button id="resetBtn" onclick="resetEnvelope(event)" class="opacity-0 pointer-events-none sans-subtle text-[10px] text-stone-500 hover:text-stone-800 tracking-[0.2em] uppercase transition-all duration-500 border-b border-stone-300 pb-0.5">
            Stäng kuvertet igen
        </button>
    </footer>

    <script>
        let isOpen = false;
        const targetDate = new Date('2027-09-04T15:00:00');

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;

            if (diff <= 0) {
                document.getElementById('days').innerText = '0';
                document.getElementById('hours').innerText = '0';
                document.getElementById('minutes').innerText = '0';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        function openEnvelope() {
            if (isOpen) return;
            isOpen = true;

            const wrapper = document.getElementById('envelopeWrapper');
            const card = document.getElementById('saveTheDateCard');
            const prompt = document.getElementById('tapPrompt');
            const resetBtn = document.getElementById('resetBtn');

            wrapper.classList.add('open');
            prompt.style.opacity = '0';

            setTimeout(() => {
                card.style.transform = 'translateY(-60%)';
                card.style.zIndex = '10';
            }, 600);

            setTimeout(() => {
                card.classList.add('card-extracted');
                resetBtn.classList.remove('opacity-0', 'pointer-events-none');
            }, 1200);
        }

        function resetEnvelope(e) {
            e.stopPropagation();
            if (!isOpen) return;
            isOpen = false;

            const wrapper = document.getElementById('envelopeWrapper');
            const card = document.getElementById('saveTheDateCard');
            const prompt = document.getElementById('tapPrompt');
            const resetBtn = document.getElementById('resetBtn');

            resetBtn.classList.add('opacity-0', 'pointer-events-none');

            card.classList.remove('card-extracted');
            card.style.transform = 'translateY(-60%)';
            card.style.zIndex = '2';

            setTimeout(() => {
                card.style.transform = 'translateY(0)';
            }, 400);

            setTimeout(() => {
                wrapper.classList.remove('open');
                prompt.style.opacity = '1';
            }, 900);
        }

        function addToCalendar(e) {
            e.stopPropagation();
            const icsData = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Ida & Fritjof Wedding//EN',
                'BEGIN:VEVENT',
                'SUMMARY:Bröllop — Ida & Fritjof',
                'DESCRIPTION:Save the date för Ida & Fritjofs bröllop på Asa Herrgård!',
                'LOCATION:Asa Herrgård, Lammhult',
                'DTSTART:20270904T130000Z',
                'DTEND:20270905T010000Z',
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\n');

            const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', 'Ida_och_Fritjof_Brollop.ics');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
