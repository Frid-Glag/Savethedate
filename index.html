<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Save the Date — Ida & Fritjof</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Great+Vibes&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #EFECE6;
            color: #1C3325;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .sans-subtle {
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.2em;
        }

        .font-script {
            font-family: 'Great Vibes', cursive;
        }

        .scene {
            perspective: 1600px;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .envelope-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 480px;
            max-height: 880px;
            cursor: pointer;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .embossed-paper {
            position: absolute;
            inset: 0;
            background-color: #F8F5F0;
            background-image: 
                radial-gradient(#d8d1c2 0.8px, transparent 0.8px), 
                radial-gradient(#d8d1c2 0.8px, #F8F5F0 0.8px);
            background-size: 26px 26px;
            background-position: 0 0, 13px 13px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.12);
        }

        .envelope-pocket-left {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 55%;
            height: 70%;
            background: linear-gradient(135deg, #EBE5D8 0%, #F3EDDF 100%);
            clip-path: polygon(0 0, 0 100%, 100% 100%);
            z-index: 3;
            pointer-events: none;
        }

        .envelope-pocket-right {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 55%;
            height: 70%;
            background: linear-gradient(-135deg, #EBE5D8 0%, #F3EDDF 100%);
            clip-path: polygon(100% 0, 0 100%, 100% 100%);
            z-index: 3;
            pointer-events: none;
        }

        .envelope-pocket-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(0deg, #E4DDCF 0%, #EFE9DC 100%);
            clip-path: polygon(0 100%, 100% 100%, 50% 15%);
            z-index: 3;
            pointer-events: none;
        }

        /* Mycket långsam vikning av klaffen (2.2s) */
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 52%;
            background-color: #F4EFE6;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23e2dac8' fill-opacity='0.45' fill-rule='evenodd'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top center;
            transform-style: preserve-3d;
            transition: transform 2.2s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 6;
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.08));
        }

        .wax-seal {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 68px;
            height: 68px;
            background: radial-gradient(circle at 35% 35%, #FAF6EE, #D8CEBC 80%);
            border-radius: 50%;
            box-shadow: 0 8px 22px rgba(0,0,0,0.18), inset 0 2px 4px rgba(255,255,255,0.8), inset 0 -2px 4px rgba(180,170,155,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 1s ease, opacity 1s ease;
            z-index: 10;
            border: 1px solid rgba(200, 190, 175, 0.6);
        }

        /* Extra långsam och svepande rörelse för kortet (3.0s) med fördröjning */
        .card {
            position: absolute;
            width: 88%;
            max-width: 390px;
            height: 84%;
            max-height: 640px;
            background: #FDFCF9;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 1.2rem 1.2rem 1.2rem;
            text-align: center;
            border: 1px solid rgba(190, 180, 165, 0.4);
            z-index: 2;
            bottom: 6%;
            transform: translateY(35%) scale(0.92);
            opacity: 0;
            transition: transform 3s cubic-bezier(0.16, 1, 0.3, 1) 0.3s, opacity 2s ease 0.3s, z-index 0s;
            pointer-events: none;
        }

        .open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .open .wax-seal {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.5);
        }

        .open .card {
            transform: translateY(0%) scale(1);
            opacity: 1;
            z-index: 50;
            pointer-events: auto;
            box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.35);
        }

        .image-crop-container {
            width: 100%;
            height: 195px;
            overflow: hidden;
            position: relative;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .image-crop-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            object-position: top center;
        }

        @keyframes pulse-subtle {
            0%, 100% { opacity: 0.5; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-3px); }
        }

        .animate-prompt {
            animation: pulse-subtle 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <main class="scene">
        <div id="envelopeWrapper" class="envelope-container embossed-paper" onclick="openEnvelope()">
            
            <div id="saveTheDateCard" class="card select-none">
                <div class="pt-0.5 pb-0.5">
                    <p class="font-serif italic text-xs sm:text-sm text-emerald-900/80">
                        Save the date
                    </p>
                </div>

                <div class="image-crop-container my-1">
                    <img src="card.jpg" alt="Asa Herrgård">
                </div>

                <div class="my-auto py-0.5 flex flex-col items-center w-full z-10">
                    <h2 class="font-script text-4xl sm:text-5xl text-emerald-950 leading-tight">
                        Ida <span class="text-3xl sm:text-4xl">&amp;</span> Fritjof
                    </h2>

                    <p class="font-serif text-sm sm:text-base text-emerald-950 mt-1 font-normal">
                        Lördag 4 september 2027
                    </p>

                    <p class="sans-subtle text-[9px] sm:text-[10px] text-emerald-900/70 uppercase tracking-[0.2em] mt-0.5">
                        04 . 09 . 2027 &nbsp;•&nbsp; ASA HERRGÅRD
                    </p>
                </div>

                <div class="w-full px-4 my-1 z-10">
                    <div class="w-12 h-[1px] bg-emerald-900/20 mx-auto mb-1.5"></div>
                    <div class="grid grid-cols-3 gap-2 text-center max-w-[190px] mx-auto">
                        <div>
                            <span id="days" class="font-serif text-base sm:text-lg font-medium text-emerald-950">---</span>
                            <p class="sans-subtle text-[7px] text-emerald-800/70 uppercase tracking-widest">dagar</p>
                        </div>
                        <div>
                            <span id="hours" class="font-serif text-base sm:text-lg font-medium text-emerald-950">--</span>
                            <p class="sans-subtle text-[7px] text-emerald-800/70 uppercase tracking-widest">timmar</p>
                        </div>
                        <div>
                            <span id="minutes" class="font-serif text-base sm:text-lg font-medium text-emerald-950">--</span>
                            <p class="sans-subtle text-[7px] text-emerald-800/70 uppercase tracking-widest">minuter</p>
                        </div>
                    </div>
                </div>

                <div class="w-full px-4 mb-1 z-10">
                    <p class="font-serif italic text-[11px] text-emerald-900/80 mb-1.5">
                        Vi gifter oss på Asa Herrgård. Spara lördagen åt oss!
                    </p>

                    <button onclick="addToCalendar(event)" class="inline-flex items-center gap-1.5 px-3 py-1 border border-emerald-900/30 rounded-full sans-subtle text-[9px] text-emerald-950 uppercase tracking-[0.15em] hover:bg-emerald-950 hover:text-white transition-colors duration-300">
                        <span>Lägg till i kalendern</span>
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                    </button>
                </div>

                <svg class="absolute bottom-0 left-0 w-20 sm:w-24 h-auto pointer-events-none opacity-80" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 0 100 Q 30 70 15 35 Q 25 55 45 40" stroke="#3D5A45" stroke-width="1.2" fill="none" opacity="0.6"/>
                    <path d="M 10 75 C 5 60 20 55 25 70 C 20 78 12 80 10 75 Z" fill="#4B6953" opacity="0.75"/>
                    <path d="M 22 55 C 18 42 32 40 34 52 C 30 60 24 60 22 55 Z" fill="#3D5A45" opacity="0.8"/>
                </svg>

                <svg class="absolute bottom-0 right-0 w-20 sm:w-24 h-auto pointer-events-none opacity-80 transform scale-x-[-1]" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 0 100 Q 30 70 15 35 Q 25 55 45 40" stroke="#3D5A45" stroke-width="1.2" fill="none" opacity="0.6"/>
                    <path d="M 10 75 C 5 60 20 55 25 70 C 20 78 12 80 10 75 Z" fill="#4B6953" opacity="0.75"/>
                    <path d="M 22 55 C 18 42 32 40 34 52 C 30 60 24 60 22 55 Z" fill="#3D5A45" opacity="0.8"/>
                </svg>
            </div>

            <div class="envelope-pocket-left"></div>
            <div class="envelope-pocket-right"></div>
            <div class="envelope-pocket-bottom flex flex-col justify-end items-center pb-8 text-center pointer-events-none z-40">
                <div id="tapPrompt" class="animate-prompt pointer-events-auto cursor-pointer" onclick="openEnvelope()">
                    <span class="sans-subtle text-[10px] text-stone-600 tracking-[0.25em] uppercase hover:text-stone-900 pb-0.5">
                        TAP THE SEAL TO OPEN
                    </span>
                </div>
            </div>

            <div class="envelope-flap"></div>

            <div id="waxSeal" class="wax-seal" onclick="openEnvelope()">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="#B5A994" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 1px 1px rgba(255,255,255,0.7));">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>

        </div>
    </main>

    <script>
        let isOpen = false;
        const targetDate = new Date('2027-09-04T15:00:00');

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;

            if (diff <= 0) {
                document.getElementById('days').innerText = '0';
                document.getElementById('hours').innerText = '0';
                document.getElementById('minutes').innerText = '0';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        function openEnvelope() {
            if (isOpen) return;
            isOpen = true;

            const wrapper = document.getElementById('envelopeWrapper');
            wrapper.classList.add('open');
        }

        function addToCalendar(e) {
            e.stopPropagation();
            const icsData = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Ida & Fritjof Wedding//EN',
                'BEGIN:VEVENT',
                'SUMMARY:Bröllop — Ida & Fritjof',
                'DESCRIPTION:Save the date för Ida & Fritjofs bröllop på Asa Herrgård!',
                'LOCATION:Asa Herrgård, Lammhult',
                'DTSTART:20270904T130000Z',
                'DTEND:20270905T010000Z',
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\n');

            const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', 'Ida_och_Fritjof_Brollop.ics');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
